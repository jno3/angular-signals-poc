<!doctype html>
<html>
<head><meta charset="utf-8"><title>bench</title></head>
<body>
  <div id="app"></div>
  <pre id="out">running...</pre>

  <script type="module">
    import { stats } from './runtime.js';
    import { ctx } from './ctx.js';

    const params = new URLSearchParams(location.search);
    const page = params.get('page');
    const target = params.get('write') ?? 's0';
    const writes = Number(params.get('writes') ?? 1000);
    const rounds = 5;

    const out = document.getElementById('out');
    if (!page) {
      out.textContent = 'add ?page=<generated file name without .js>';
      throw new Error('missing page parameter');
    }

    let reads = 0;
    for (const [key, value] of Object.entries(ctx)) {
      if (typeof value === 'function' && typeof value.set === 'function') {
        const counted = () => { reads++; return value(); };
        counted.set = value.set;
        counted.update = value.update;
        ctx[key] = counted;
      }
    }

    const { create, update } = await import(`./${page}.js`);
    const app = document.getElementById('app');
    const refs = create(app, ctx);
    update(refs, ctx);

    reads = 0;
    const effectsBefore = stats.effectRuns;
    ctx[target].set(999999);
    update(refs, ctx);
    const readsPerWrite = reads;
    const effectsPerWrite = stats.effectRuns - effectsBefore;

    const correct = app.firstElementChild?.textContent === '999999';

    const times = [];
    for (let r = 0; r < rounds; r++) {
      const t0 = performance.now();
      for (let i = 0; i < writes; i++) {
        ctx[target].set(r * writes + i);
        update(refs, ctx);
      }
      times.push(performance.now() - t0);
    }
    times.sort((a, b) => a - b);
    const median = times[Math.floor(rounds / 2)];

    const line =
      `${page}: reads/write=${readsPerWrite}, effect runs/write=${effectsPerWrite}, ` +
      `median of ${rounds} rounds x ${writes} writes=${median.toFixed(1)} ms, correct=${correct}`;
    out.textContent = line;
    console.log(line);
  </script>
</body>
</html>
